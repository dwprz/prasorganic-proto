syntax = "proto3";

package product.type;

option go_package = "github.com/dwprz/prasorganic-proto/protogen/product";

message ProductIds {
    repeated uint32 ids = 1;
}

message ProductData {
    uint32 productId = 1 [json_name = "product_id"];
    uint32 quantity = 2;
}

message UpdateStocksReq {
    repeated ProductData data = 1;
}

message RollbackStocksReq {
    repeated ProductData data = 1;
}